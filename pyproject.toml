[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lark-cards"
dynamic = ["version"]
description = "Feishu/Lark CardKit v2.0 real-time streaming cards for Hermes Agent Gateway"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Duseus" }]
keywords = ["Hermes", "Feishu", "Lark", "streaming-cards", "CardKit", "Agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "lark-oapi>=1.4.0",
  "PyYAML>=6.0",
]

[project.scripts]
hermes-lark-cards = "hermes_lark_cards.__main__:main"

[project.entry-points."hermes_agent.plugins"]
hermes-lark-cards = "hermes_lark_cards"

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/Duseus/hermes-lark-cards"
Repository = "https://github.com/Duseus/hermes-lark-cards.git"
Issues = "https://github.com/Duseus/hermes-lark-cards/issues"

[tool.setuptools.packages.find]
include = ["hermes_lark_cards*"]

[tool.setuptools.package-data]
hermes_lark_cards = [
  "assets/icons/*",
  "studio/web/*",
  "studio/web/css/*",
  "studio/web/js/*",
  "studio/web/assets/icons/*",
]

[tool.setuptools.dynamic]
version = { attr = "hermes_lark_cards.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["tests/samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF006"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "lark_oapi.*"
ignore_missing_imports = true
